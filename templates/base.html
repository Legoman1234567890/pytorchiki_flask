<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Витрина новостроек{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Choices.js для поиска в мультиселектах -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/styles/choices.min.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="{{ url_for('index') }}" class="logo">🏙 Витрина новостроек</a>

        <nav class="nav">
            <a href="{{ url_for('index') }}"
               class="nav-link {% if active_page == 'index' %}active{% endif %}">🏠 Карточки</a>
            <a href="{{ url_for('map_view') }}"
               class="nav-link {% if active_page == 'map' %}active{% endif %}">🗺 Карта</a>
            <a href="{{ url_for('favorites_view') }}"
               class="nav-link {% if active_page == 'favorites' %}active{% endif %}">
                ❤ Избранное
                <span id="fav-count" class="badge">{{ session.get('favorites', [])|length }}</span>
            </a>
            <a href="{{ url_for('analytics') }}"
               class="nav-link {% if active_page == 'analytics' %}active{% endif %}">📊 Аналитика</a>
        </nav>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>© Витрина новостроек · данные из production_data_merged.csv</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/choices.js@10.2.0/public/assets/scripts/choices.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
